<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ЦУП — Центр управления производством</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#31312F">
<meta name="description" content="ЦУП — Центр управления производством, Jasyl Suyq Qazaqstan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЦУП">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#31312F}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;
       padding:env(safe-area-inset-top) 0 0 0;box-sizing:border-box;background:#fff}
  .scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;text-align:center;padding:24px;z-index:5}
  .scr img{width:140px;height:140px}
  .scr b{font-size:20px}
  .scr p{margin:0;color:#666;font-size:15px;max-width:320px;line-height:1.4}
  .bar{width:120px;height:4px;background:#eee;border-radius:4px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#BAD701;animation:go 1.1s infinite ease-in-out}
  @keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  button{font-size:16px;padding:12px 22px;border:0;border-radius:12px;background:#31312F;color:#fff;font-weight:600}
  button.lime{background:#BAD701;color:#31312F}
  #inst{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;background:#31312F;color:#fff;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #inst span{flex:1;font-size:14px;line-height:1.35}
  #inst button{padding:9px 14px;font-size:14px}
  #inst .x{background:transparent;color:#bbb;padding:6px 8px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- ▼▼▼ ЕДИНСТВЕННОЕ, ЧТО НУЖНО ВПИСАТЬ: ссылка на ваше приложение (Развернуть → Управление развёртываниями → «URL веб-приложения», заканчивается на /exec) -->
<script>var APP_URL = 'https://script.google.com/macros/s/AKfycbwem8tBWmcs3MDcEbI9O9J2UTateOizRy0LFZBKDzmwEcyZClzRG_szchJytWFjY8vxNg/exec';</script>
<!-- ▲▲▲ -->

<div class="scr" id="load">
  <img src="icons/icon-192.png" alt="">
  <b>ЦУП</b>
  <div class="bar"><i></i></div>
  <p>Центр управления производством</p>
</div>

<div class="scr" id="off" hidden>
  <img src="icons/icon-192.png" alt="">
  <b>Нет связи</b>
  <p>Проверьте интернет (Wi-Fi или мобильные данные) и нажмите «Повторить».</p>
  <button class="lime" onclick="start()">🔄 Повторить</button>
</div>

<iframe id="app" title="ЦУП" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen" hidden></iframe>

<div id="inst">
  <span id="instT"></span>
  <button class="lime" id="instB" hidden>Установить</button>
  <button class="x" onclick="hideInst(true)">✕</button>
</div>

<script>
(function () {
  var app = document.getElementById('app'), load = document.getElementById('load'), off = document.getElementById('off');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  // Параметры ссылки (?q=станок, ?op=… и т.п.) передаём в приложение как есть
  function target() { return APP_URL + (location.search || ''); }

  window.start = function () {
    if (!navigator.onLine) { load.hidden = true; off.hidden = false; return; }
    off.hidden = true; load.hidden = false;
    var done = false;
    app.onload = function () { done = true; load.hidden = true; app.hidden = false; };
    app.src = target();
    // если Google долго не отвечает — всё равно показываем, что пришло
    setTimeout(function () { if (!done) { load.hidden = true; app.hidden = false; } }, 12000);
  };
  window.addEventListener('offline', function () { if (app.hidden) { load.hidden = true; off.hidden = false; } });
  window.addEventListener('online', function () { if (!off.hidden) start(); });
  start();

  // ── Подсказка «Установить» (только когда открыто в браузере, а не как приложение)
  var box = document.getElementById('inst'), T = document.getElementById('instT'), B = document.getElementById('instB'), deferred = null;
  function seen() { try { return localStorage.getItem('cupInstHide') === '1'; } catch (e) { return false; } }
  window.hideInst = function (forever) { box.style.display = 'none'; if (forever) try { localStorage.setItem('cupInstHide', '1'); } catch (e) {} };
  if (!standalone && !seen()) {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (ios) {
      T.innerHTML = '📲 Установить ЦУП на телефон: нажмите <b>«Поделиться»</b> ⬆️ внизу Safari → <b>«На экран „Домой“»</b>.';
      setTimeout(function () { box.style.display = 'flex'; }, 2500);
    }
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      T.textContent = '📲 Установить ЦУП на телефон — иконка на главном экране, открывается без браузера.';
      B.hidden = false; box.style.display = 'flex';
    });
    B.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; hideInst(true); }); };
  }
  window.addEventListener('appinstalled', function () { hideInst(true); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
